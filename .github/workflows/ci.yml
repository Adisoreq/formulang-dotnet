name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FormuLang.NET.sln

      - name: Build
        run: dotnet build FormuLang.NET.sln -c Release --no-restore

      - name: Test
        run: dotnet test FormuLang.NET.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          dotnet pack src/FormuLang.NET.Abstractions -c Release --no-build -o artifacts
          dotnet pack src/FormuLang.NET.Core -c Release --no-build -o artifacts
          dotnet pack src/FormuLang.NET.Extensions.Stock -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
